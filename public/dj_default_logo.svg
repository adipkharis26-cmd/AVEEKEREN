<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="badgeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="85%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="neonGlowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Inner Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#badgeGrad)" stroke="#27272a" stroke-width="4"/>
  
  <!-- Stylized DJ Text -->
  <g text-anchor="middle" font-family="'Impact', 'Montserrat', 'Arial Black', sans-serif">
    <!-- Top Word: Keyra -->
    <text x="250" y="240" font-size="88" font-weight="900" fill="#facc15" filter="url(#neonGlowYellow)" letter-spacing="1">
      Keyra
    </text>
    <!-- Bottom Word: Fvnky -->
    <text x="250" y="325" font-size="78" font-style="italic" font-weight="900" fill="#ef4444" letter-spacing="2">
      Fvnky
    </text>
  </g>
</svg>
